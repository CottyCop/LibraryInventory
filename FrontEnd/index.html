<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Librería sin animo de lucro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/utilities.css">
  <link rel="stylesheet" href="./assets/css/pages/index.css">

</head>
<body>

  <h1>Inventario</h1>

  <nav class="toolbar">
    <a href="./detail.html">Detalle por ISBN</a>
    <span class="muted">|</span>
    <span class="muted">API: <code id="apiBase"></code></span>
  </nav>

  <form id="searchForm">
    <input id="q" name="q" placeholder="Buscar por título…" />
    <input id="editorialId" name="editorialId" type="number" min="1" placeholder="EditorialId" />
    <select id="pageSize" name="pageSize">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
    </select>
    <button type="submit">Buscar</button>
  </form>

  <div id="status" class="muted"></div>

  <table>
    <thead>
      <tr>
        <th>ISBN</th>
        <th>Título</th>
        <th>Editorial</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows">
      <!-- filas aquí -->
    </tbody>
  </table>

  <div class="pagination">
    <button id="prevBtn" type="button">« Anterior</button>
    <span id="pageInfo" class="muted"></span>
    <button id="nextBtn" type="button">Siguiente »</button>
  </div>

  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./index.page.js" defer></script>
</body>
</html>
