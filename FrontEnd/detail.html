<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Detalle del libro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/utilities.css">
  <link rel="stylesheet" href="./assets/css/pages/detail.css">

</head>
<body>
  <h1>Detalle del libro</h1>
  <nav class="row">
    <a href="./index.html">← Volver al listado</a>
    <span class="muted">|</span>
    <span class="muted">API: <code id="apiBase"></code></span>
  </nav>

  <div class="row">
    <input id="isbn" type="number" min="1" placeholder="ISBN" />
    <button id="btn">Buscar</button>
    <span id="status" class="muted"></span>
  </div>
  
  <div id="book-wrap" class="book-wrap" hidden>
    <div id="card" class="card book" hidden>

      <div class="page left">
      <h2 id="titulo"></h2>
      <p><strong>ISBN:</strong> <span id="isbnText"></span></p>
      <p><strong>Editorial:</strong> <span id="editorial"></span></p>
      <p><strong>Páginas:</strong> <span id="paginas"></span></p>
      <p><strong>Sinopsis:</strong> <span id="sinopsis"></span></p>
      </div>

      <div class="page right">
      <p><strong>Autores:</strong></p>
      <ul id="autores"></ul>
      </div>
    </div>
  </div>


  <script src="./config.js"></script>
  <script src="./api.js"></script>
  <script src="./detail.page.js" defer></script>
</body>
</html>
